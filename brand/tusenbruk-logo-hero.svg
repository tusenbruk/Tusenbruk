<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&amp;family=Cormorant+Garamond:ital,wght@0,300;1,300&amp;display=swap');
    </style>
  </defs>

  <!-- Double rule — top -->
  <line x1="40" y1="52" x2="760" y2="52" stroke="#F5F0E8" stroke-width="1.25"/>
  <line x1="40" y1="57" x2="760" y2="57" stroke="#F5F0E8" stroke-width="0.35"/>

  <!-- Primary wordmark -->
  <text
    x="400"
    y="172"
    text-anchor="middle"
    font-family="'Playfair Display', 'Didot', 'Georgia', 'Times New Roman', serif"
    font-size="88"
    font-weight="400"
    letter-spacing="14"
    fill="#F5F0E8">TUSENBRUK</text>

  <!-- Double rule — bottom -->
  <line x1="40" y1="198" x2="760" y2="198" stroke="#F5F0E8" stroke-width="0.35"/>
  <line x1="40" y1="203" x2="760" y2="203" stroke="#F5F0E8" stroke-width="1.25"/>

  <!-- Category line -->
  <text
    x="400"
    y="238"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Georgia', serif"
    font-size="12"
    font-weight="300"
    letter-spacing="5"
    fill="#C8B89A">WATCHES · CAMERAS · PENS &amp; WRITING · CARS · LUGGAGE</text>

  <!-- Hairline separator -->
  <line x1="240" y1="254" x2="560" y2="254" stroke="#C8B89A" stroke-width="0.5"/>

  <!-- Tagline -->
  <text
    x="400"
    y="278"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', 'Georgia', serif"
    font-size="15"
    font-weight="300"
    font-style="italic"
    letter-spacing="1"
    fill="#F5F0E8">Earn the wear.</text>

</svg>
